name: Repository safety

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and local paths
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install pinned Gitleaks CLI
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.0

      - name: Scan Git history for secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --no-color --redact --verbose .

      - name: Scan repository files for local paths
        run: python3 scripts/check_repository_safety.py --all-files

